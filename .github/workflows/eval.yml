name: Eval

run-name: ${{ inputs.run-name }}

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: string
      shell:
        default: bash
        type: string
      run:
        required: true
        type: string
      environment:
        required: false
        type: string
      checkout:
        default: false
        type: boolean
      timeout-minutes:
        default: 360
        type: number
      working-directory:
        required: false
        type: string
      continue-on-error:
        default: false
        type: boolean
      run-name:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{ github.token }}
  VARS_JSON: ${{ toJSON(vars) }}

x-job-template: &job-template
  runs-on: ${{ inputs.runs-on }}
  environment: ${{ inputs.environment }}
  timeout-minutes: ${{ inputs.timeout-minutes }}
  continue-on-error: ${{ inputs.continue-on-error }}

jobs:
  sh:
    <<: *job-template
    if: ${{ inputs.shell == 'sh' }}
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: sh
        working-directory: ${{ inputs.working-directory || '.' }}

  bash:
    <<: *job-template
    if: ${{ inputs.shell == 'bash' }}
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}

  pwsh:
    <<: *job-template
    if: ${{ inputs.shell == 'pwsh' }}
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: pwsh
        working-directory: ${{ inputs.working-directory || '.' }}

  cmd:
    <<: *job-template
    if: ${{ inputs.shell == 'cmd' }}
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: cmd
        working-directory: ${{ inputs.working-directory || '.' }}
