name: Eval

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: string
      shell:
        default: bash
        type: string
      run:
        required: true
        type: string
      environment:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  sh:
    if: ${{ inputs.shell == 'sh' }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - run: ${{ inputs.run }}
        shell: sh

  bash:
    if: ${{ inputs.shell == 'bash' }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - run: ${{ inputs.run }}
        shell: bash

  pwsh:
    if: ${{ inputs.shell == 'pwsh' }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - run: ${{ inputs.run }}
        shell: pwsh

  cmd:
    if: ${{ inputs.shell == 'cmd' }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - run: ${{ inputs.run }}
        shell: cmd
