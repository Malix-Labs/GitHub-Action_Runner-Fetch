name: Eval

run-name: ${{ inputs.run-name }}

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: string
      shell:
        default: bash
        type: string
      run:
        required: true
        type: string
      environment:
        required: false
        type: string
      checkout:
        default: false
        type: boolean
      timeout-minutes:
        default: 360
        type: number
      working-directory:
        required: false
        type: string
      continue-on-error:
        default: false
        type: boolean
      run-name:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{ github.token }}
  VARS_JSON: ${{ toJSON(vars) }}

jobs:
  sh:
    if: ${{ inputs.shell == 'sh' }}
    runs-on: &runs-on ${{ inputs.runs-on }}
    environment: &environment ${{ inputs.environment }}
    timeout-minutes: &timeout-minutes ${{ inputs.timeout-minutes }}
    continue-on-error: &continue-on-error ${{ inputs.continue-on-error }}
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: sh
        working-directory: ${{ inputs.working-directory || '.' }}

  bash:
    if: ${{ inputs.shell == 'bash' }}
    runs-on: *runs-on
    environment: *environment
    timeout-minutes: *timeout-minutes
    continue-on-error: *continue-on-error
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}

  pwsh:
    if: ${{ inputs.shell == 'pwsh' }}
    runs-on: *runs-on
    environment: *environment
    timeout-minutes: *timeout-minutes
    continue-on-error: *continue-on-error
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: pwsh
        working-directory: ${{ inputs.working-directory || '.' }}

  cmd:
    if: ${{ inputs.shell == 'cmd' }}
    runs-on: *runs-on
    environment: *environment
    timeout-minutes: *timeout-minutes
    continue-on-error: *continue-on-error
    steps:
      - if: ${{ inputs.checkout }}
        uses: actions/checkout@v7
      - run: ${{ inputs.run }}
        shell: cmd
        working-directory: ${{ inputs.working-directory || '.' }}
